<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-GRID | Professional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00ffcc;
            --bg: #050509;
            --glass: rgba(10, 20, 30, 0.7);
            --font-code: 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* --- 1. LOADER --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .spinner-ring {
            width: 80px; height: 80px; border: 4px solid transparent;
            border-top: 4px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 15px var(--primary);
        }
        
        .loading-text { font-family: var(--font-code); letter-spacing: 2px; color: var(--primary); font-size: 1.2em; }
        .loading-percent { font-size: 3em; font-weight: bold; color: #fff; opacity: 0.8; margin-top: 10px; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- 2. BACKGROUND --- */
        #bg-canvas { position: absolute; top: 0; left: 0; z-index: -1; }

        /* --- 3. DASHBOARD --- */
        .container {
            position: relative; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            height: 100%; width: 100%;
        }

        .dashboard {
            width: 90%; max-width: 450px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,255,204,0.3);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(0,255,204,0.1);
            transition: 0.3s;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand { color: var(--primary); font-weight: bold; font-family: var(--font-code); letter-spacing: 1px; }
        
        .ghost-btn { cursor: pointer; color: #555; transition: 0.3s; }
        .ghost-btn:hover { color: #fff; }

        .inputs input, .inputs textarea {
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid #333;
            color: var(--primary); padding: 12px; margin-bottom: 10px;
            border-radius: 5px; font-family: var(--font-code);
        }
        .inputs input:focus, .inputs textarea:focus { outline: none; border-color: var(--primary); }

        .btn-main {
            width: 100%; padding: 15px; background: var(--primary);
            border: none; border-radius: 5px; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0,255,204,0.4);
            transition: 0.3s;
        }
        .btn-main:hover { transform: scale(1.02); }

        /* OUTPUT AREA (Modified for Sharing) */
        .output-area {
            margin-top: 20px; background: #000; padding: 15px;
            border-left: 3px solid var(--primary); font-family: var(--font-code);
            font-size: 0.9em; word-break: break-all; color: #ccc; display: none;
        }

        .share-toolbar {
            display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;
        }

        .share-btn {
            flex: 1; padding: 8px; background: rgba(0,255,204,0.1);
            border: 1px solid var(--primary); color: var(--primary);
            border-radius: 4px; cursor: pointer; font-size: 0.8em;
            transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px;
        }
        .share-btn:hover { background: var(--primary); color: #000; }

        /* --- DEV PROFILE --- */
        #dev-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .holo-card {
            width: 300px; padding: 30px;
            background: rgba(10,20,30,0.9); border: 1px solid var(--primary);
            text-align: center; border-radius: 10px;
            box-shadow: 0 0 30px var(--primary);
            transform-style: preserve-3d;
        }
        
        .profile-icon { font-size: 3em; color: var(--primary); margin-bottom: 15px; }
        .dev-name { font-size: 1.5em; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .dev-role { color: #888; font-size: 0.8em; letter-spacing: 2px; margin-bottom: 20px; }
        .stats { text-align: left; font-size: 0.8em; color: #aaa; margin-bottom: 20px; line-height: 1.6; }
        .stats b { color: var(--primary); }

        /* --- GHOST MODE --- */
        body.ghost-active { background: #fff; color: #000; }
        body.ghost-active #bg-canvas { display: none; }
        body.ghost-active .dashboard { background: #fff; border: 1px solid #ccc; box-shadow: none; color: #000; }
        body.ghost-active .inputs input, body.ghost-active .inputs textarea { background: #f0f0f0; color: #000; border: 1px solid #ccc; }
        body.ghost-active .btn-main { background: #ddd; color: #333; box-shadow: none; }
        body.ghost-active .brand { color: #333; }
        body.ghost-active .output-area { background: #eee; color: #333; border-left: 3px solid #999; }
        body.ghost-active .share-btn { border: 1px solid #999; color: #333; background: #fff; }

    </style>
</head>
<body>

<div id="loader">
    <div class="spinner-ring"></div>
    <div class="loading-text">SYSTEM INITIALIZING</div>
    <div class="loading-percent" id="load-val">0%</div>
</div>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <div class="dashboard">
        <div class="header">
            <div class="brand">CYBER-GRID v4.2</div>
            <div>
                <i class="fas fa-eye-slash ghost-btn" onclick="toggleGhost()" title="Ghost Mode"></i>
                <i class="fas fa-user-circle ghost-btn" style="margin-left:15px" onclick="openDev()" title="Profile"></i>
            </div>
        </div>

        <div class="inputs">
            <input type="password" id="pass" placeholder="SECURITY KEY">
            <textarea id="msg" rows="4" placeholder="ENTER DATA..."></textarea>
        </div>

        <button class="btn-main" onclick="encrypt()">ENCRYPT / LOCK DATA</button>
        <button class="btn-main" style="margin-top:10px; background:transparent; border:1px solid var(--primary); color:var(--primary)" onclick="decrypt()">DECRYPT / UNLOCK</button>

        <div class="output-area" id="output-box">
            </div>
    </div>
</div>

<div id="dev-overlay" onclick="closeDev()">
    <div class="holo-card">
        <div class="profile-icon"><i class="fas fa-user-secret"></i></div>
        <div class="dev-name">KASUN</div>
        <div class="dev-role">SYSTEM ARCHITECT</div>
        <div class="stats">
            > SKILL: <b>WEB / CYBER SECURITY</b><br>
            > SERVER: <b>NUWARA_LK</b><br>
            > STATUS: <b>ONLINE</b><br>
            > PROJECT: <b>KUB_OFC</b>
        </div>
        <div style="font-size:0.7em; color:#555;">CLICK ANYWHERE TO CLOSE</div>
    </div>
</div>

<script>
    // --- LOADER ---
    let loadVal = 0;
    const loadInt = setInterval(() => {
        loadVal += Math.floor(Math.random() * 5);
        if(loadVal > 100) loadVal = 100;
        document.getElementById('load-val').innerText = loadVal + '%';
        if(loadVal === 100) {
            clearInterval(loadInt);
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            }, 300);
        }
    }, 50);

    // --- BG ANIMATION ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2;
            this.speedX = Math.random() * 1 - 0.5;
            this.speedY = Math.random() * 1 - 0.5;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
            if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
        }
        draw() {
            ctx.fillStyle = '#00ffcc';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    function animateBg() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            for (let j = i; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    ctx.strokeStyle = `rgba(0, 255, 204, ${1 - dist/100})`;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        if(!document.body.classList.contains('ghost-active')) requestAnimationFrame(animateBg);
    }
    animateBg();

    // --- MAIN LOGIC (UPDATED FOR SHARING) ---
    
    // Global variable to hold current result
    let currentResult = "";

    function encrypt() {
        let msg = document.getElementById('msg').value;
        let pass = document.getElementById('pass').value;
        if(!msg || !pass) { alert("Data Missing!"); return; }
        let enc = CryptoJS.AES.encrypt(msg, pass).toString();
        showOutput(enc);
    }

    function decrypt() {
        let msg = document.getElementById('msg').value;
        let pass = document.getElementById('pass').value;
        try {
            let bytes = CryptoJS.AES.decrypt(msg, pass);
            let original = bytes.toString(CryptoJS.enc.Utf8);
            if(original) showOutput(original);
            else alert("Wrong Password!");
        } catch(e) { alert("Invalid Code!"); }
    }

    function showOutput(text) {
        currentResult = text;
        let box = document.getElementById('output-box');
        box.style.display = 'block';
        
        // Inject HTML with Buttons
        box.innerHTML = `
            <div style="margin-bottom:10px">${text}</div>
            <div class="share-toolbar">
                <button class="share-btn" onclick="copyText()"><i class="fas fa-copy"></i> COPY</button>
                <button class="share-btn" onclick="sendWhatsApp()"><i class="fab fa-whatsapp"></i> SEND</button>
                <button class="share-btn" onclick="shareNative()"><i class="fas fa-share-alt"></i> SHARE</button>
            </div>
        `;
    }

    // --- SHARE FUNCTIONS ---
    function copyText() {
        navigator.clipboard.writeText(currentResult);
        alert("Copied to Clipboard!");
    }

    function sendWhatsApp() {
        let url = "https://wa.me/?text=" + encodeURIComponent(currentResult);
        window.open(url, '_blank');
    }

    function shareNative() {
        if (navigator.share) {
            navigator.share({
                title: 'Secure Data',
                text: currentResult,
            }).catch(console.error);
        } else {
            alert("Share not supported on this browser. Use Copy.");
        }
    }

    // --- UTILS ---
    function toggleGhost() {
        document.body.classList.toggle('ghost-active');
        if(!document.body.classList.contains('ghost-active')) animateBg();
    }
    function openDev() { document.getElementById('dev-overlay').style.display = 'flex'; }
    function closeDev() { document.getElementById('dev-overlay').style.display = 'none'; }

</script>
</body>
</html>
